[project]
name = "claims-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Core
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "fastapi[standard]",
    "slowapi>=0.1.9",

    # Orchestration
    "langgraph>=1.2.7",
    "langchain>=1.3.11",

    # Policy Retrieval Agent (RAG)
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.7.0",

    # Fraud Risk Agent (classical ML)
    "scikit-learn>=1.9.0",
    "xgboost>=3.3.0",

    # "shap>=0.52",
    "pandas>=3.0.3",
    "numpy>=2.5.1",

    # LLM providers
    "ollama>=0.6.2",


    # For Visualizing graphs
    "grandalf>=0.8",
    "pypdf>=6.14.2",
    "fastapi-swagger-ui-theme>=0.1.0",



]
[dependency-groups]
# Dev / test
dev = ["pytest>=9.1.1"]
frontend = ["streamlit>=1.40.0"]
